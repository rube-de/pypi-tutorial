name: Publish Package

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version
      id: version
      run: echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Build package
      run: uv build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi  # No protection rules - auto-deploy
      url: https://test.pypi.org/p/example-package-rube
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Publish to TestPyPI
      env:
        UV_PUBLISH_URL: https://test.pypi.org/legacy/
      run: |
        echo "🧪 Publishing ${{ needs.build.outputs.version }} to TestPyPI"
        uv publish dist/*

  publish-pypi:
    needs: [build, publish-testpypi]  # Only after TestPyPI succeeds
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || contains(github.ref, 'refs/tags/v')
    environment:
      name: pypi  # Configure with protection rules in GitHub
      url: https://pypi.org/p/example-package-rube
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Publish to PyPI
      run: |
        echo "📦 Publishing ${{ needs.build.outputs.version }} to PyPI"
        echo "⚠️  This requires manual approval in GitHub"
        uv publish dist/*