name: Publish to PyPI

on:
  release:
    types: [published]  # PyPI: Only on GitHub releases
  push:
    tags:
      - 'v*-test'      # TestPyPI: Test tags
      - 'v*-rc*'       # TestPyPI: Release candidates
      - 'v*-alpha*'    # TestPyPI: Alpha versions
      - 'v*-beta*'     # TestPyPI: Beta versions

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Build package
      run: uv build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Only run for GitHub releases
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/example-package-rube
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Publish to PyPI
      run: |
        echo "📦 Publishing to PyPI (Production)"
        uv publish dist/*

  publish-to-testpypi:
    needs: build
    runs-on: ubuntu-latest
    # Only run for test tags (not releases)
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/example-package-rube
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Publish to TestPyPI
      env:
        UV_PUBLISH_URL: https://test.pypi.org/legacy/
      run: |
        echo "🧪 Publishing to TestPyPI (Testing)"
        uv publish dist/*