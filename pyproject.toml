[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "example_package_rube"
dynamic = ["version"]
authors = [
  { name="rube", email="bernhard@oasisprotocol.org" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["*LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/rube-de/pypi-tutorial"
"Bug Tracker" = "https://github.com/rube-de/pypi-tutorial/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/example_package_rube/_version.py"
